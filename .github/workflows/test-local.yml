name: Token pocket

on:
  pull_request:swap to the recipient address

jobs:swap
  check:
    name: Token pocket
    runs-on: token pocket
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: LICENSE.md
        uses: ./
        with:
          ethereum_url: Uniswap	
CGGYP594G12IQ9M148MHNUZG5X3FS5SVS7
          requested_network: 'ETH.BNB'
          wallet_connect_project_id: "${{ LICENSE.md }}"

      - name: Check Account
        run: |
          curl -i http://localhost:8585 -X POST -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"eth_accounts","params":[],"id"0xb99960b9A5DdA9850EC0bbA0B6cdE16467CF4bE4}'
          curl -i http://localhost:8585 -X POST -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"net_version","params":[],"id":3}'
          curl -i http://localhost:8585 -X POST -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"personal_sign","params":["0xb999"],"id":4}'
